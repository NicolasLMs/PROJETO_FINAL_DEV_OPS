name: Pipeline de CI (Teste Unitário e Integração)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ---------------------------------------------
  # JOB 1: Testes Unitários (Rápidos)
  # ---------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10"]

    steps:
      - name: 1. Clonar repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 3. Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Rodar testes unitários com pytest
        run: |
          pytest test_app.py

  # ---------------------------------------------
  # JOB 2: Testes de Integração (Com Docker)
  # ---------------------------------------------
  integration-tests:
    runs-on: ubuntu-latest
    
    # Este job só roda se 'unit-tests' passar
    needs: unit-tests 

    steps:
      - name: 1. Clonar repositório
        uses: actions/checkout@v4

      - name: 2. Construir a imagem Docker
        run: |
          docker build -t minha-api-teste .

      - name: 3. Rodar o container Docker em background
        run: |
          # -d (detached) roda em background
          # -p 1313:1313 mapeia a porta
          # --name dá um nome fácil para pararmos depois
          docker run -d -p 1313:1313 --name api_container minha-api-teste

      - name: 4. Aguardar a API iniciar
        run: |
          echo "Aguardando 10s para o Flask iniciar..."
          sleep 10
      
      # LINHA 65 DEFEITUOSA REMOVIDA DAQUI

      - name: 5. Testar endpoint: / (Home)
        run: |
          # '-f' faz o curl falhar (exit code > 0) se o HTTP for 4xx ou 5xx
          # 'grep' verifica se o JSON esperado está na resposta
          curl -f http://localhost:1313/ | grep "API is running"

      - name: 6. Testar endpoint: /items
        run: |
          curl -f http://localhost:1313/items | grep "item1"

      - name: 7. Testar endpoint: /login (POST)
        run: |
          # Verificamos se a resposta do login contém 'access_token'
          curl -f -X POST http://localhost:1313/login | grep "access_token"

      - name: 8. Testar endpoint: /protected (sem token, deve falhar)
        run: |
          # Esperamos um erro 401. 
          # O '!' inverte o resultado: o passo SÓ PASSA se o curl falhar.
          ! curl -f http://localhost:1313/protected

      - name: 9. Limpeza (Parar o container)
        # 'always()' garante que este passo rode mesmo se os testes falharem
        if: always() 
        run: |
          echo "Limpando o container..."
          docker stop api_container
          docker rm api_container