name: CI/CD Pipeline - Build, Test, Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build . --file Dockerfile --tag my-flask-app:${{ github.sha }}

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest

  deploy_to_vercel:
    name: Deploy to Vercel (via Hook)
    runs-on: ubuntu-latest
    # Este job só roda se 'build' E 'test' passarem
    needs: [build, test]
    # Este job só roda em pushes para a 'main', não em pull requests
    if: github.ref == 'refs/heads/main'

    steps:
      # Não precisamos fazer checkout do código aqui.
      # O Vercel recebe o sinal e busca o commit mais recente
      # da branch 'main' por conta própria.
      - name: Trigger Vercel Deploy Hook
        run: curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }}