name: Pipeline de CI/CD (Testes e Deploy)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ---------------------------------------------
  # JOB 1: Testes Unitários (Não mudou)
  # ---------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10"]

    steps:
      - name: 1. Clonar repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 3. Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Rodar testes unitários com pytest
        run: |
          python -m pytest test_app.py

  # ---------------------------------------------
  # JOB 2: Testes de Integração (Endpoints Públicos)
  # ---------------------------------------------
  integration-test-public:
    runs-on: ubuntu-latest
    needs: unit-tests 

    steps:
      - name: 1. Clonar repositório
        uses: actions/checkout@v4

      - name: 2. Construir imagem Docker
        run: |
          docker build -t minha-api-teste .

      - name: 3. Rodar container Docker em background
        run: |
          docker run -d -p 1313:1313 --name api_container minha-api-teste

      - name: 4. Aguardar API iniciar
        run: |
          echo "Aguardando 10s para o Flask iniciar..."
          sleep 10

      - name: 5. Testar endpoint /
        run: |
          curl -f http://localhost:1313/ | grep "API is running"

      - name: 6. Testar endpoint /items
        run: |
          curl -f http://localhost:1313/items | grep "item1"

      - name: 7. Limpeza (parar container)
        if: always()
        run: |
          docker stop api_container
          docker rm api_container

  # ---------------------------------------------
  # JOB 3: Testes de Integração (Endpoints de Auth)
  # ---------------------------------------------
  integration-test-auth:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: 1. Clonar repositório
        uses: actions/checkout@v4

      - name: 2. Construir imagem Docker
        run: |
          docker build -t minha-api-teste .

      - name: 3. Rodar container Docker em background
        run: |
          docker run -d -p 1313:1313 --name api_container minha-api-teste

      - name: 4. Aguardar API iniciar
        run: |
          echo "Aguardando 10s para o Flask iniciar..."
          sleep 10

      - name: 5. Testar endpoint /login (POST)
        run: |
          curl -f -X POST http://localhost:1313/login | grep "access_token"

      - name: 6. Testar endpoint /protected (sem token)
        run: |
          ! curl -f http://localhost:1313/protected

      - name: 7. Limpeza (parar container)
        if: always()
        run: |
          docker stop api_container
          docker rm api_container

  # ---------------------------------------------
  # JOB 4: Deploy no Render
  # ---------------------------------------------
  deploy-to-render:
    runs-on: ubuntu-latest
    
    # Depende de TODOS os jobs de teste. Só roda se todos passarem.
    needs: [unit-tests, integration-test-public, integration-test-auth]
    
    # IMPORTANTE: Só faz deploy em PUSH para a 'main', nunca em Pull Requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 1. Acionar Deploy Hook do Render
        run: |
          # Usa o 'curl' para mandar um POST para o hook
          # O ${{ secrets.RENDER_DEPLOY_HOOK }} é o segredo que você criou no GitHub
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}