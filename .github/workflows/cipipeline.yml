name: Pipeline de CI (Teste Unitário e Integração)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ---------------------------------------------
  # JOB 1: Testes Unitários
  # ---------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10"]

    steps:
      - name: 1. Clonar repositório
        uses: actions/checkout@v4

      - name: 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 3. Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Rodar testes unitários com pytest
        run: |
          pytest teste_app.py

  # ---------------------------------------------
  # JOB 2: Testes de Integração (Usando Docker)
  # ---------------------------------------------
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: 1. Clonar repositório
        uses: actions/checkout@v4

      - name: 2. Construir imagem Docker
        run: |
          docker build -t minha-api-teste .

      - name: 3. Rodar container Docker em background
        run: |
          docker run -d -p 1313:1313 --name api_container minha-api-teste

      - name: 4. Aguardar API iniciar
        run: |
          echo "Aguardando 10s para o Flask iniciar..."
          sleep 10

      - name: 5. Testar endpoint /
        run: |
          curl -f http://localhost:1313/ | grep "API is running"

      - name: 6. Testar endpoint /items
        run: |
          curl -f http://localhost:1313/items | grep "item1"

      - name: 7. Testar endpoint /login (POST)
        run: |
          curl -f -X POST http://localhost:1313/login | grep "access_token"

      - name: 8. Testar endpoint /protected (sem token)
        run: |
          ! curl -f http://localhost:1313/protected

      - name: 9. Limpeza (parar container)
        if: always()
        run: |
          docker stop api_container
          docker rm api_container
