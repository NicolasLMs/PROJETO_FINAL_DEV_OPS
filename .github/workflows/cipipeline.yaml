name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  BUILD:
    name: 1. Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4 # Versão atualizada

      - name: Build com docker compose
        run: docker compose -f docker-compose.yaml build

      - name: Validar sintaxe do app dentro do container
        run: docker compose run --rm api python -m py_compile app.py

  TEST:
    name: 2. Test
    runs-on: ubuntu-latest
    needs: BUILD

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build novamente (workspace do GitHub zera)
        run: docker compose -f docker-compose.yaml build

      - name: Rodar testes
        run: docker compose run --rm api python -m unittest discover -s . -p "test_*.py"


  DEPLOY:
    name: 3. Deploy
    runs-on: ubuntu-latest
    needs: TEST
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Vercel Deploy Hook
        run: curl -X POST "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}